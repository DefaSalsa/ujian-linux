# Build Linux di GitHub
name: Build Linux

on:
  workflow_dispatch:
  push:

jobs:
  build:
    # Ubuntu 22.04 dipakai agar hasil build (glibc 2.35) jalan di distro yang lebih lama
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Pasang dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev

      - name: Pasang dependensi npm
        run: npm install

      - name: Terapkan build.env
        shell: bash
        run: |
          set -e
          get() { grep -E "^$1=" build.env | head -1 | cut -d= -f2- | tr -d '\r'; }
          APP_NAME="$(get APP_NAME)"
          APP_ID="$(get APP_ID)"
          PASSWORD="$(get PASSWORD)"
          HOME_URL="$(get HOME_URL)"
          LOGIN_TITLE="$(get LOGIN_TITLE)"
          ARTIFACT_NAME="$(get ARTIFACT_NAME)"
          LOGO="$(get LOGO)"
          ORIGIN="$(echo "$HOME_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          export APP_NAME APP_ID
          sed -i -E "s|const HOME_URL: &str = \".*\";|const HOME_URL: \&str = \"$HOME_URL\";|; s|const PASSWORD: &str = \".*\";|const PASSWORD: \&str = \"$PASSWORD\";|; s|\.title\(\"[^\"]*\"\)|.title(\"$APP_NAME\")|" src-tauri/src/main.rs
          sed -i "s|https://mankeerom.yzz.me/ujian|$HOME_URL|g" src/index.html src-tauri/src/main.rs
          sed -i "s|<h1>[^<]*</h1>|<h1>$LOGIN_TITLE</h1>|; s|<title>[^<]*</title>|<title>$APP_NAME</title>|" src/index.html
          sed -i "s|https://mankeerom.yzz.me/\*|$ORIGIN/*|" src-tauri/capabilities/default.json
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.productName=process.env.APP_NAME;c.identifier=process.env.APP_ID;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          echo "APP_NAME_FILE=${APP_NAME// /_}" >> "$GITHUB_ENV"
          echo "LOGO=$LOGO" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME// /_}" >> "$GITHUB_ENV"

      - name: Pasang logo
        run: |
          cp "$LOGO" app-icon.png
          cp "$LOGO" src/logo.png

      - name: Buat ikon
        run: npx tauri icon app-icon.png --fit contain

      - name: Build
        run: npm run tauri build

      - name: Kumpulkan file
        run: |
          mkdir -p package
          for f in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "package/$(basename "$f" | tr ' ' '_')"
          done

      # Nama artifact diambil dari ARTIFACT_NAME di build.env
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: package/
