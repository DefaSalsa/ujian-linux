name: Build Linux

on:
  workflow_dispatch:
  push:

jobs:
  build:
    # Ubuntu 22.04 dipakai agar hasil build (glibc 2.35) jalan di distro yang lebih lama
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Pasang dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev

      - name: Pasang dependensi npm
        run: npm install

      - name: Buat ikon
        run: npx tauri icon app-icon.png --fit contain

      - name: Build
        run: npm run tauri build

      - name: Kumpulkan file
        run: |
          mkdir -p package
          cp src-tauri/target/release/bundle/deb/*.deb package/
          cp src-tauri/target/release/bundle/appimage/*.AppImage package/

      # Artifact ini didownload sebagai UjianMAN.zip (berisi .deb dan AppImage)
      - uses: actions/upload-artifact@v4
        with:
          name: UjianMAN
          path: package/
