<!DOCTYPE html>
<!-- Halaman login -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian MAN</title>
<style>
  :root {
    --bg: #F3F4F6; --card: #FFFFFF; --line: #D1D5DB; --title: #111827; --sub: #6B7280;
    --field: #FFFFFF; --field-line: #9CA3AF; --field-text: #111827; --btn: #0D9488;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #111827; --line: #374151; --title: #F9FAFB; --sub: #9CA3AF;
      --field: #1F2937; --field-line: #6B7280; --field-text: #F9FAFB; --btn: #2563EB;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #111827; --line: #374151; --title: #F9FAFB; --sub: #9CA3AF;
    --field: #1F2937; --field-line: #6B7280; --field-text: #F9FAFB; --btn: #2563EB;
  }
  body { margin: 0; height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 36px 40px; width: 360px; box-sizing: border-box; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  img { width: 96px; height: 96px; }
  h1 { font-size: 24px; color: var(--title); margin: 12px 0 6px; }
  p { font-size: 14px; color: var(--sub); margin: 0 0 24px; }
  input { width: 100%; box-sizing: border-box; padding: 12px 16px; border: 1px solid var(--field-line); border-radius: 12px; font-size: 15px; color: var(--field-text); background: var(--field); }
  button { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 12px; background: var(--btn); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .err { color: #DC2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="">
  <h1>Ujian Online MAN Keerom</h1>
  <p>Masukkan password untuk memulai ujian</p>
  <input id="pwd" type="password" placeholder="Password">
  <button id="go">Masuk</button>
  <div class="err" id="err"></div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  // Ujian hanya dibuka kalau halaman ujian bisa dihubungi, supaya tidak masuk layar penuh tanpa koneksi
  async function cekJaringan() {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      await fetch('https://mankeerom.yzz.me/ujian', { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
      return true;
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }
  async function masuk() {
    const pwd = document.getElementById('pwd').value;
    const ok = await invoke('login', { pwd });
    if (ok) {
      if (!(await cekJaringan())) {
        document.getElementById('err').textContent = 'Jaringan lemah. Periksa koneksi internet, lalu tekan Masuk lagi.';
        return;
      }
      document.getElementById('err').textContent = '';
      await invoke('open_exam');
    } else {
      document.getElementById('err').textContent = 'Password salah';
      document.getElementById('pwd').value = '';
    }
  }
  document.getElementById('go').onclick = masuk;
  document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') masuk(); });
</script>
</body>
</html>
